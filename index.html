<style>
:root{
  --bg:#F3F6F8;--panel:#FFFFFF;--ink:#0D2236;--ink2:#37495A;--muted:#5B6F80;--faint:#8A9AA8;--line:#E2E8ED;--line2:#EEF2F5;
  --navy:#0B2440;--navy2:#132F50;--teal:#0F9B95;--teal-d:#0B6F6B;--teal-soft:#D8F1EF;
  --rads:#8A1C2B;--ahkf:#1D3F7A;
  --ok:#1F7A4C;--ok-bg:#E3F3EA;--warn:#9A6212;--warn-bg:#FBF0DD;--bad:#B4232F;--bad-bg:#FBE4E6;--info-bg:#EEF2F5;
  --font:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
input,select,textarea{padding:9px 11px;border:1px solid #D5DEE5;border-radius:8px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
a{color:var(--teal)}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{cursor:pointer;border:0;border-radius:8px;padding:9px 16px;font-weight:700;background:var(--teal);color:#fff;white-space:nowrap}
.btn:hover{background:var(--teal-d)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #D5DEE5;font-weight:400}
.btn.sec:hover{background:var(--bg)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.link{background:none;color:var(--teal);padding:0;font-weight:700}
.btn:disabled{opacity:.55;cursor:wait}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.xs{font-size:12px}
.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--teal-soft);color:var(--teal-d)}.p-mute{background:var(--info-bg);color:var(--muted)}
.ent{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff;display:inline-block}
.ent-RADS{background:var(--rads)}.ent-AHKF{background:var(--ahkf)}.ent-Both{background:var(--teal)}
.av{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.bar{height:8px;background:#E9EEF2;border-radius:4px;position:relative}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.bar>b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink)}
.chip{background:var(--teal-soft);color:var(--teal-d);font-size:13px;padding:3px 10px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.chip button{all:unset;cursor:pointer;font-weight:700}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:18px}
[hidden]{display:none!important}

.sp-logos{display:flex;align-items:center;gap:32px;margin-bottom:26px;animation:splashPop .6s ease}
.sp-logos img{height:112px;width:auto;display:block}
.sp-sep{width:1px;height:64px;background:rgba(14,26,47,.3)}
.splash-title{font-size:30px;font-weight:700;color:#0e1a2f}
.splash-sub{font-size:14px;letter-spacing:.5px;margin:6px 0 22px;color:#24455f}
.sp-bar{width:220px;height:4px;border-radius:4px;background:rgba(14,26,47,.18);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1D9E75,#1f5fd0);animation:spLoad 2.6s ease forwards}
.sp-pill{position:absolute;bottom:26px;display:flex;align-items:center;gap:10px;background:#0e1a2f;color:#cfe3ee;padding:7px 18px 7px 8px;border-radius:30px;font-size:13px;box-shadow:0 6px 18px rgba(14,26,47,.3)}
.sp-pill img{width:26px;height:26px;border-radius:7px}.sp-pill b{color:#fff}
@keyframes splashPop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes splashFade{0%,78%{opacity:1}100%{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes spLoad{to{width:100%}}
@media(max-width:560px){.sp-logos img{height:64px}.sp-logos{gap:20px}.splash-title{font-size:24px}}

/* sign-in */
#login{min-height:100%;display:grid;place-items:center;background:var(--navy);padding:16px}
.login-card{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login-ents{display:flex;gap:14px;align-items:center;justify-content:center}.login-ents img{height:46px}.login-ents i{width:1px;height:30px;background:var(--line)}
.field{display:flex;flex-direction:column;gap:5px}.field>label,.lbl{font-size:13px;color:var(--muted)}

/* shell */
#app{display:flex;min-height:100%}
#side{width:236px;background:var(--navy);color:#C9D7E2;display:flex;flex-direction:column;padding:22px 14px;gap:22px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.brand img{width:38px;height:38px;border-radius:9px;background:#fff}
.brand b{display:block;color:#fff;letter-spacing:2px;font-size:13px}.brand span{font-size:12px;color:#8FA6B8}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#C9D7E2}
.nav button:hover{background:#ffffff10}
.nav button.on{background:#ffffff1c;color:#fff;font-weight:700}
.nav .n{font-size:11px;background:#E5555F;color:#fff;border-radius:9px;padding:0 6px;font-weight:700}
.side-h{font-size:11px;letter-spacing:1.5px;color:#6F87A0;padding:0 12px;margin-bottom:-12px}
.plist{display:flex;flex-direction:column;gap:1px}
.plist button{all:unset;cursor:pointer;display:flex;gap:9px;align-items:center;padding:7px 12px;border-radius:7px;font-size:14px;color:#C9D7E2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.plist button:hover{background:#ffffff10}.plist button.on{background:#ffffff1c;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-ok{background:#3FBF7F}.d-warn{background:#E0A13A}.d-bad{background:#E5555F}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-foot .btn{width:100%}
.who{font-size:13px;color:#8FA6B8;border-top:1px solid #ffffff1a;padding:12px 4px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.who b{color:#fff;display:block}
.who button{all:unset;cursor:pointer;color:#7FD3CE;font-size:13px}
main{flex:1;min-width:0;padding:28px 40px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:28px}
.seg{display:inline-flex;background:#fff;border:1px solid #D5DEE5;border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 14px;border-radius:999px;font-size:13px}
.seg button.on{background:var(--navy);color:#fff}
.stack{display:flex;flex-direction:column;gap:20px}

/* home */
.brief{background:var(--navy);color:#E6EEF4;border-radius:14px;padding:20px 24px;display:flex;gap:16px}
.brief .ai{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.brief p{margin:6px 0 0;font-size:17px;line-height:1.55;max-width:95ch}
.brief .eyebrow{color:#7FD3CE}
.brief button{all:unset;cursor:pointer;color:#7FD3CE;font-size:14px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:16px 18px}.kpi .l{font-size:13px;color:var(--muted)}.kpi .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}.kpi .s{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.pane{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{font-size:18px}
.ptable{display:grid;grid-template-columns:minmax(0,2.3fr) 64px minmax(0,1.5fr) minmax(0,1.5fr) 88px;gap:0 16px;align-items:center;font-size:14px}
.ptable>.h{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700;padding-bottom:6px}
.ptable>.r{display:contents;cursor:pointer}
.ptable>.r>*{padding:11px 0;border-top:1px solid var(--line2)}
.ptable>.r:hover>*{background:#FAFCFD}
.dec{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.dec:last-child{border-bottom:0;padding-bottom:0}
.due{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:8px 10px;align-items:baseline;font-size:14px}
.due .r{display:contents;cursor:pointer}
.due .r:hover span{color:var(--teal-d)}

/* week */
.checkin{background:#fff;border:1px solid #F0D9A8;border-radius:12px;padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.wcol{display:flex;flex-direction:column;gap:12px}
.wcol-h{display:flex;justify-content:space-between;font-weight:700}
.tcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.tcard:hover{border-color:#C3D0DA}
.tcard .meta{font-size:12px;color:var(--muted)}
.tcard b{font-size:16px}
.tcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.trow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer}
.trow:hover{border-color:#C3D0DA}

/* projects list */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{padding:18px 20px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.pcard:hover{border-color:#C3D0DA}
.pcard h3{font-size:17px}

/* project */
.crumb{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.ptitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:26px;border-bottom:1px solid #DCE3E9;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 0;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--teal)}
.tl{position:relative;height:58px;margin-top:4px}
.tl .base{position:absolute;left:0;right:0;top:27px;height:4px;background:#E9EEF2;border-radius:2px}
.tl .fill{position:absolute;left:0;top:27px;height:4px;background:var(--teal);border-radius:2px}
.tl .now{position:absolute;top:6px;width:2px;height:46px;background:var(--ink)}
.tl .m{position:absolute;top:21px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid #fff;cursor:pointer;box-shadow:0 0 0 1px #0001}
.tl .m.pay{border-radius:2px;transform:rotate(45deg)}
.tl-months{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:18px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.items{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(90px,140px) 96px 104px;gap:0 14px;align-items:center;font-size:14px}
.items .r{display:contents;cursor:pointer}
.items .r>*{padding:11px 0;border-bottom:1px solid var(--line2)}
.items .r:hover>*{background:#FAFCFD}
.items .r:last-child>*{border-bottom:0}
.ico{width:12px;height:12px;border-radius:50%;justify-self:center}
.ico.open{border:2px solid var(--teal)}.ico.late{background:var(--bad)}.ico.done{background:var(--ok)}
.ico.pay{border-radius:2px;transform:rotate(45deg)}
.ico.pay.open{border-color:var(--ahkf)}.ico.pay.done{background:var(--ahkf)}
.feed{display:flex;flex-direction:column;gap:16px}
.fi{display:flex;gap:10px}.fi .h{font-size:13px;color:var(--muted)}.fi .h b{color:var(--ink)}.fi .x{white-space:pre-wrap;margin-top:3px;font-size:14px}
.composer{border:1px solid #D5DEE5;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.composer textarea{border:0;padding:4px;box-shadow:none}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:#04101C70;display:flex;justify-content:flex-end;z-index:50}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--bg);width:min(640px,100%);height:100%;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.modal{background:#fff;border-radius:14px;padding:24px;width:min(600px,100%);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.meta-g{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:14px}.meta-g dt{color:var(--muted)}.meta-g dd{margin:0}
.banner{border-radius:10px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.banner.warn{background:var(--warn-bg);color:#6B4A10}.banner.bad{background:var(--bad-bg);color:#7A1820}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types button{border:1px solid #D5DEE5;background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer}
.types button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:9px;z-index:90;box-shadow:0 8px 24px #0003}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th,table.t td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line2)}table.t th{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.tw{overflow-x:auto}
.notice{background:var(--teal-soft);color:var(--teal-d);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* import */
.steps{display:flex;gap:26px;font-size:14px;color:var(--muted)}.steps .on{color:var(--ink);font-weight:700}.steps .done{color:var(--ok)}
.drop{display:block;border:2px dashed #C9D5DE;border-radius:12px;padding:38px 20px;text-align:center;background:#FAFCFD;cursor:pointer}
.drop.on{border-color:var(--teal);background:var(--teal-soft)}
.imp{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
.imp aside{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.imp aside>.eyebrow,.imp aside>.banner,.imp aside>.xs,.imp aside>.small,.imp aside>b{grid-column:1/-1}
.imp aside .g2{display:contents}
.igrid{display:grid;grid-template-columns:24px minmax(220px,1.4fr) 120px 150px 130px minmax(220px,1fr);gap:10px 12px;align-items:start;font-size:14px}
.igrid .h{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700}
.igrid .off{opacity:.45}
.igrid input,.igrid select{padding:7px 8px}
.ghead{font-size:12px;letter-spacing:1.5px;font-weight:700;margin-top:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* payments */
.month{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:70px minmax(0,1.4fr) minmax(0,1fr) 150px 96px;gap:12px;align-items:center;font-size:14px;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}

/* mini */
body.mini #app{display:block}
body.mini #side{display:none}
body.mini main{padding:0}
.mini-h{background:#fff;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:2}
.mini-list{padding:12px;display:flex;flex-direction:column;gap:10px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:5px;font-size:14px;cursor:pointer}
.mcard .k{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;font-weight:700}
.filt{display:flex;gap:6px;flex-wrap:wrap}.filt button{border:0;background:var(--info-bg);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}.filt button.on{background:var(--navy);color:#fff}

@media(max-width:1100px){.cols,.imp{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){
  #app{flex-direction:column}#side{width:auto;height:auto;position:static;padding:12px 16px;gap:12px}
  .nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap}.plist,.side-h{display:none}.side-foot{flex-direction:row}
  main{padding:20px 16px}.wcols,.g2{grid-template-columns:1fr}
  .ptable{grid-template-columns:minmax(0,1fr) 88px}.ptable>.h:nth-child(n+2):nth-child(-n+4),.ptable .hide-s{display:none}
  .items{grid-template-columns:18px minmax(0,1fr) 92px}.items .hide-s{display:none}
  .prow{grid-template-columns:60px minmax(0,1fr) 96px}.prow .hide-s{display:none}
}
</style>

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), 3000); }
async function post(body){
  if (API_URL.indexOf('PASTE_') === 0) throw new Error('Set API_URL at the top of index.html to your Apps Script /exec address.');
  const r = await fetch(API_URL, {method:'POST', body:JSON.stringify(body)});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Something went wrong.');
  return j.data;
}
async function api(action, p){
  try { return await post({token:S.token, action, p:p||{}}); }
  catch(e){ if (String(e.message).indexOf('SESSION_EXPIRED') > -1) { logout(true); throw new Error('Your session ended. Sign in again.'); } throw e; }
}
const pd = s => s ? new Date(String(s).slice(0,10)+'T00:00:00') : null;
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const plus = n => { const d=today(); d.setDate(d.getDate()+n); return iso(d); };
function fmt(s, yr){ const d=pd(s); if(!d||isNaN(d)) return ''; const o={day:'numeric',month:'short'}; if(yr||d.getFullYear()!==new Date().getFullYear()) o.year='numeric'; return d.toLocaleDateString('en-GB',o); }
function when(s){ const d=new Date(String(s).replace(' ','T')); if(isNaN(d)) return s; const m=(Date.now()-d)/6e4; if(m<1)return 'just now'; if(m<60)return Math.round(m)+' min ago'; if(m<1440)return Math.round(m/60)+' hr ago'; if(m<2880)return 'yesterday'; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
const list = s => String(s||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
const uname = e => { const u=(S.d&&S.d.users||[]).find(x=>x.email===String(e).toLowerCase()); return u?u.name:(e||''); };
const short = e => { const n=uname(e).split(/\s+/); return n.length>1 ? n[0]+' '+n[n.length-1][0]+'.' : n[0]; };
const ini = e => uname(e).split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const proj = id => (S.d.projects||[]).find(p=>p.id===id);
const money = (n,c) => (c||'PKR')+' '+Number(n||0).toLocaleString('en-US');
const isDir = () => ['Director','Admin'].includes(S.d.me.role);
const entOk = x => !S.ent || x.entity===S.ent || x.entity==='Both';
const SMALL=['a','an','and','as','at','but','by','for','from','in','into','of','on','or','per','the','to','via','vs','with'];
function titleCase(s){ const a=String(s||'').trim().replace(/\s+/g,' ').split(' '); return a.map((w,i)=>{ if(/[A-Z].*[A-Z]|\d/.test(w)||/^[^A-Za-z]*$/.test(w)) return w; const lw=w.toLowerCase(); if(i>0&&i<a.length-1&&SMALL.includes(lw)&&!/[:\-–]$/.test(a[i-1])) return lw; return w.split('-').map(p=>p?p[0].toUpperCase()+p.slice(1):p).join('-'); }).join(' '); }
function status(t){
  if (t.status==='Completed') return t.kind==='Payment' ? ['Received','p-ok'] : ['Completed','p-ok'];
  if (t.pendingDue) return ['Date Requested','p-warn'];
  if (t.overdue) return ['Overdue','p-bad'];
  if (t.blocked) return ['Blocked','p-warn'];
  if (t.status==='Delayed') return ['Delayed','p-bad'];
  if (t.status==='At Risk'||t.status==='Changed') return [t.status,'p-warn'];
  if (t.status==='On Track') return ['On Track','p-ok'];
  return ['Not Started','p-mute'];
}
const pill = t => { const [l,c]=status(t); return `<span class="pill ${c}">${l}</span>`; };
const hpill = h => `<span class="pill ${h==='At Risk'?'p-bad':h==='Watch'?'p-warn':'p-ok'}">${h}</span>`;
const hdot = h => h==='At Risk'?'d-bad':h==='Watch'?'d-warn':'d-ok';
const entTag = e => e ? `<span class="ent ent-${esc(e)}">${esc(e)}</span>` : '';

async function start(){

function itemRows(T){

function timeline(p, T){
  const dates=T.filter(t=>t.dueDate).map(t=>pd(t.dueDate));
  let a=pd(p.start)||(dates.length?new Date(Math.min(...dates)):null), b=pd(p.end)||(dates.length?new Date(Math.max(...dates)):null);
  if(!a||!b||b<=a) return '';
  const pos=d=>Math.max(0,Math.min(100,(d-a)/(b-a)*100)), now=pos(today());
  const months=[]; const m=new Date(a.getFullYear(),a.getMonth(),1); while(m<=b&&months.length<24){ months.push(m.toLocaleDateString('en-GB',{month:'short'})+(m.getMonth()===0?' '+String(m.getFullYear()).slice(2):'')); m.setMonth(m.getMonth()+1); }
  const step=Math.ceil(months.length/12);
  const marks=T.filter(t=>t.dueDate).map(t=>{ const done=t.status==='Completed', late=t.overdue||t.status==='Delayed', pay=t.kind==='Payment';
    const fill=done?(pay?'var(--ahkf)':'var(--ok)'):late?'var(--bad)':'#fff', ring=done||late?'#fff':(pay?'var(--ahkf)':'var(--teal)');
    return `<span class="m ${pay?'pay':''}" data-open="${esc(t.id)}" title="${esc(t.title)} · ${fmt(t.dueDate,1)}" style="left:${pos(pd(t.dueDate))}%;background:${fill};border-color:${ring}"></span>`; }).join('');
  return `<section class="card pane" style="gap:8px"><div class="tl-months">${months.filter((x,i)=>i%step===0).map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="tl"><div class="base"></div><div class="fill" style="width:${now}%"></div><div class="now" style="left:${now}%" title="Today"></div>${marks}</div>
    <div class="legend"><span>● Milestone or Deliverable</span><span>◆ Payment</span><span style="color:var(--bad)">● Late</span><span style="color:var(--ok)">● Done</span><span>| Today</span></div></section>`;
}

function drawTask(t){
  const p=proj(t.projectId), closed=t.status==='Completed';
  const types = closed ? (t.canClose?['Reopen','Comment']:['Comment']) : ['Progress','Delay','Change','Comment'].concat(t.canClose?['Completed']:[]);
  if(!types.includes(S.type)) S.type=types[0];
  const TL={Progress:'Progress',Delay:'Request New Date',Change:'Report Change',Comment:'Comment',Completed:t.kind==='Payment'?'Mark Received':'Mark Complete',Reopen:'Reopen'};
  const owner=list(t.assignees);
  $('#layer').innerHTML=`<div class="scrim" id="scrim"><div class="drawer">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="small muted">${esc(t.id)} · ${esc(t.kind)} ${entTag(t.entity)}</span><button class="btn sec sm" id="dX">Close</button></div>
    <h2 style="font-size:23px">${esc(t.title)}</h2>
    ${t.pendingDue?`<div class="banner warn"><b>New Date Requested</b><span>${esc(uname(t.pendingBy))} asks to move the due date from ${fmt(t.dueDate,1)} to <b>${fmt(t.pendingDue,1)}</b>.</span>${t.pendingReason?`<span>“${esc(t.pendingReason)}”</span>`:''}
      ${t.isDirector?`<div style="display:flex;gap:8px;margin-top:4px"><button class="btn sm" id="dAp">Approve New Date</button><button class="btn sec sm" id="dRj">Decline</button></div>`:'<span class="xs">A director needs to approve it.</span>'}</div>`:''}
    ${t.blocked?`<div class="banner warn"><b>Waiting on Another Item</b><span>This can only happen after <a href="#" id="dDep">${esc(t.blockedBy)}</a> is complete.</span></div>`:''}
    <div class="card" style="padding:16px"><dl class="meta-g">
      <dt>Status</dt><dd>${pill(t)}</dd>
      <dt>Project</dt><dd>${p?`<a href="#" id="dProj">${esc(p.name)}</a>`:'General / Operations'}</dd>
      <dt>Owner(s)</dt><dd>${owner.map(uname).map(esc).join(', ')}</dd>
      <dt>Informed</dt><dd>${list(t.watchers).map(uname).map(esc).join(', ')||'—'}</dd>
      <dt>Due</dt><dd>${fmt(t.dueDate,1)||'—'}${t.slipDays?` <span class="pill p-warn">${t.slipDays>0?'+':''}${t.slipDays} days vs original ${fmt(t.originalDue,1)}</span>`:''}</dd>
      ${t.amount?`<dt>Amount</dt><dd><b>${money(t.amount,t.currency)}</b></dd>`:''}
      ${t.recur?`<dt>Repeats</dt><dd>${esc(t.recur)}</dd>`:''}
      <dt>Created</dt><dd>${esc(uname(t.createdBy))} · ${esc(when(t.createdAt))}</dd>
      ${t.description?`<dt>Details</dt><dd style="white-space:pre-wrap">${esc(t.description)}</dd>`:''}
    </dl>${t.canClose?'<button class="btn link" id="dEdit" style="margin-top:10px">Edit Item</button>':''}</div>
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><b>Post an Update</b>
      <div class="types">${types.map(x=>`<button data-t="${x}" class="${S.type===x?'on':''}">${TL[x]}</button>`).join('')}</div>
      ${S.type==='Progress'?`<div class="field"><label for="uS">Status</label><select id="uS">${['On Track','At Risk'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}
      ${S.type==='Delay'?`<div class="field"><label for="uDue">New Due Date</label><input id="uDue" type="date" value="${esc(t.pendingDue||t.dueDate)}"></div><div class="xs muted">${t.isDirector?'As a director, your new date applies straight away.':'A director will be asked to approve the new date. The current date stays until then.'}</div>`:''}
      <div class="field"><label for="uT">${S.type==='Delay'?'Reason and Recovery Plan':S.type==='Change'?'What Changed and Why':S.help?'What Do You Need Help With?':'Message'}</label><textarea id="uT" rows="3"></textarea></div>
      <div class="field"><span class="lbl">Tag People (They Get Access and an Email)</span><div id="uM"></div></div>
      <div><button class="btn" id="uGo">Post Update</button></div><div class="err" id="uErr"></div></div>
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px"><b>Activity</b>${feedHtml(t.updates.slice().reverse(),false)}</div>
  </div></div>`;
  $('#dX').onclick=closeLayer; $('#scrim').onclick=e=>{ if(e.target.id==='scrim') closeLayer(); };
  $$('#layer .types button').forEach(b=>b.onclick=()=>{ S.type=b.dataset.t; S.help=false; drawTask(t); });
  const dp=$('#dProj'); if(dp) dp.onclick=e=>{ e.preventDefault(); closeLayer(); go('project',t.projectId); };
  const dd=$('#dDep'); if(dd) dd.onclick=e=>{ e.preventDefault(); openTask(t.blockedById); };
  const ap=$('#dAp'); if(ap) ap.onclick=()=>decide(t.id,true,ap);
  const rj=$('#dRj'); if(rj) rj.onclick=()=>decide(t.id,false,rj);
  const ed=$('#dEdit'); if(ed) ed.onclick=()=>editItem(t);
  let pre=[]; if(S.help&&p&&p.manager) pre=[String(p.manager).toLowerCase()];
  const gm=picker($('#uM'),pre,'Type a name to tag');
  $('#uGo').onclick=async()=>{ const b=$('#uGo'); b.disabled=true; $('#uErr').textContent='';
    try{ const nt=await api('update',{id:t.id,type:S.type,text:$('#uT').value,status:$('#uS')?$('#uS').value:'',newDue:$('#uDue')?$('#uDue').value:'',mentions:gm()});
      toast(S.type==='Delay'&&!t.isDirector?'Date request sent to directors.':'Update posted.'); S.help=false; drawTask(nt); reload(); }catch(e){ $('#uErr').textContent=e.message; b.disabled=false; } };
}

    <div class="field"><label for="iT">Title</label><input id="iT" value="${esc(t.title)}"></div>
    <div class="g2"><div class="field"><label for="iK">Type</label><select id="iK">${S.d.kinds.map(k=>`<option ${t.kind===k?'selected':''}>${k}</option>`).join('')}</select></div>
      <div class="field"><label for="iR">Repeats</label><select id="iR">${S.d.recur.map(r=>`<option value="${r}" ${t.recur===r?'selected':''}>${r||'Does Not Repeat'}</option>`).join('')}</select></div>
      <div class="field"><label for="iAm">Amount</label><div style="display:flex;gap:6px"><select id="iCu" style="width:90px">${['PKR','USD','GBP','EUR'].map(c=>`<option ${(t.currency||'PKR')===c?'selected':''}>${c}</option>`).join('')}</select><input id="iAm" type="number" value="${esc(t.amount)}"></div></div>
      <div class="field"><label for="iDep">Can Only Start After</label><select id="iDep"><option value="">Nothing</option>${S.d.tasks.filter(x=>x.projectId===t.projectId&&x.id!==t.id).map(x=>`<option value="${esc(x.id)}" ${t.dependsOn===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div></div>
    <div class="field"><span class="lbl">Owner(s)</span><div id="iA"></div></div><div class="field"><span class="lbl">Keep Informed</span><div id="iW"></div></div>
    <div class="field"><label for="iDe">Details</label><textarea id="iDe" rows="3">${esc(t.description)}</textarea></div>
    ${t.dueDate?'<div class="xs muted">To change the due date, use “Request New Date” so the change is approved and recorded.</div>':'<div class="field"><label for="iD">Due Date</label><input id="iD" type="date"></div>'}
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn sec" data-x>Cancel</button><button class="btn" id="iGo">Save</button></div><div class="err" id="iErr"></div>`);
  const ga=picker($('#iA'),list(t.assignees),'Add owner'), gw=picker($('#iW'),list(t.watchers),'Add person');

    try{ const p={id:t.id,title:$('#iT').value,kind:$('#iK').value,recur:$('#iR').value,amount:$('#iAm').value,currency:$('#iAm').value?$('#iCu').value:'',dependsOn:$('#iDep').value,assignees:ga(),watchers:gw(),description:$('#iDe').value};
      if($('#iD')) p.dueDate=$('#iD').value; const nt=await api('editTask',p); toast('Saved.'); drawTask(nt); reload(); }catch(e){ $('#iErr').textContent=e.message; b.disabled=false; } };
}

/* ============ AI import ============ */
const AI={file:null,res:null,target:''};
function importView(){
  const steps=`<div class="steps"><span class="${AI.res?'done':'on'}">${AI.res?'✓ ':''}1 Upload</span><span class="${AI.res?'on':''}">2 Review &amp; Assign</span><span>3 Notify</span></div>`;
  if(!AI.res){
    $('#main').innerHTML=`<div class="top"><div><h1>${AI.target?'Add Items from Document':'New Project from Document'}</h1><div class="muted small">AI reads the agreement, finds milestones, payments, reports and deadlines, and suggests owners. You review everything before anyone is notified.</div></div>${steps}</div>
    <section class="card pane" style="max-width:860px">
      <div class="g2"><div class="field"><label for="aiP">Add To</label><select id="aiP"><option value="">A New Project</option>${S.d.projects.map(p=>`<option value="${esc(p.id)}" ${AI.target===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="aiH">Note for the AI (Optional)</label><input id="aiH" placeholder="e.g. Signed 1 Oct 2026; Finance owns all payments"></div></div>
      <label class="drop" id="aiDrop" for="aiF"><b style="font-size:16px">Drop the Document Here or Click to Choose</b><div class="small muted" style="margin-top:4px">PDF, Word, Excel, image or text · up to 10 MB · grant agreements, MOUs, contracts, proposals, workplans, POs</div><div id="aiFn" style="margin-top:10px;font-weight:700">${AI.file?esc(AI.file.name):''}</div></label>
      <input type="file" id="aiF" hidden accept=".pdf,.docx,.xlsx,.xls,.csv,.txt,.png,.jpg,.jpeg,.webp">
      <div class="field"><label for="aiTx">Or Paste Text (Email, Clause, Schedule)</label><textarea id="aiTx" rows="3"></textarea></div>
      <div><button class="btn" id="aiGo">Read with AI</button></div><div class="err" id="aiErr"></div></section>`;
    const drop=$('#aiDrop');
    ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('on')}));
    ['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('on')}));
    drop.addEventListener('drop',x=>{ if(x.dataTransfer.files[0]) setFile(x.dataTransfer.files[0]); });
    $('#aiF').onchange=e=>{ if(e.target.files[0]) setFile(e.target.files[0]); };
    function setFile(f){ if(f.size>10*1024*1024){ $('#aiErr').textContent='That file is over 10 MB. Upload a smaller copy or paste the key sections.'; return; } AI.file=f; $('#aiFn').textContent=f.name; }
    $('#aiP').onchange=()=>{ AI.target=$('#aiP').value; };
    $('#aiGo').onclick=aiRead; return;
  }
  aiReview(steps);
}
const b64=buf=>{ let s='',b=new Uint8Array(buf); for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };
async function aiRead(){
  const btn=$('#aiGo'); $('#aiErr').textContent=''; AI.target=$('#aiP').value;
  const p={hint:$('#aiH').value, text:$('#aiTx').value};
  if(!AI.file && !p.text.trim()){ $('#aiErr').textContent='Choose a document or paste some text first.'; return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>Reading the Document… 20–60 Seconds';
  try{
    if(AI.file){ const f=AI.file, buf=await f.arrayBuffer(), ext=f.name.split('.').pop().toLowerCase();
      p.fileName=f.name; p.mime=f.type||'application/octet-stream'; p.base64=b64(buf);
      if(ext==='docx'){ if(!window.mammoth) throw new Error('The Word reader did not load. Refresh and try again, or save as PDF.'); p.text=(await mammoth.extractRawText({arrayBuffer:buf})).value+'\n'+p.text; }
      else if(['xlsx','xls','csv'].includes(ext)){ if(!window.XLSX) throw new Error('The Excel reader did not load. Refresh and try again.'); const wb=XLSX.read(buf,{type:'array',cellDates:true}); p.text=wb.SheetNames.map(n=>'## '+n+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n')+'\n'+p.text; }
      else if(ext==='txt') p.text=new TextDecoder().decode(buf)+'\n'+p.text;
      else if(!(p.mime==='application/pdf'||/^image\//.test(p.mime))) throw new Error('This file type is not supported. Use PDF, Word, Excel, an image or text.');
    }
    AI.res=await api('aiExtract',p);
    AI.res.items.forEach(i=>{ i.include=true; i.assignees=i.owners||[]; i.watchers=[]; });
    importView();
  }catch(e){ $('#aiErr').textContent=e.message; btn.disabled=false; btn.textContent='Read with AI'; }
}
function aiReview(steps){

  $('#main').innerHTML=`<div class="top"><div><h1>${ex?'Add Items to '+esc(ex.name):'New Project from Document'}</h1><div class="muted small">${esc(AI.file?AI.file.name:'Pasted text')}${r.docUrl?` · <a href="${esc(r.docUrl)}" target="_blank" rel="noopener">Saved to Drive</a>`:''}</div></div>${steps}</div>
  <div class="imp">
    <aside class="card pane">
      ${ex?`<div class="eyebrow">Adding To</div><b style="font-size:17px">${esc(ex.name)}</b>`:`<div class="eyebrow">Project Details · Edit Anything</div>

      ${pr.aiName&&pr.aiName!==pr.name?`<div class="xs muted" style="margin-top:-8px">Name in the document: “${esc(pr.aiName)}”</div>`:''}
      <div class="field"><label for="rC">Short Code (Used in Emails)</label><input id="rC" value="${esc(pr.code||'')}"></div>
      <div class="g2"><div class="field"><label for="rE">Entity</label><select id="rE">${opt(['RADS','AHKF','Both'],defEnt)}</select></div>
      <div class="field"><label for="rD">Donor</label><input id="rD" value="${esc(pr.donor||'')}"></div>
      <div class="field"><label for="rS">Start</label><input id="rS" type="date" value="${esc(pr.start||'')}"></div>
      <div class="field"><label for="rF">End</label><input id="rF" type="date" value="${esc(pr.end||'')}"></div></div>
      <div class="field"><label for="rM">Project Manager</label><select id="rM">${S.d.users.map(u=>`<option value="${esc(u.email)}" ${u.email===S.d.me.email?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>
      ${pr.value?`<div class="small muted">Value: <b style="color:var(--ink)">${money(pr.value,pr.currency)}</b></div>`:''}
      ${pr.summary?`<div class="small muted">${esc(pr.summary)}</div>`:''}`}
      ${(r.risks||[]).length||r.items.some(i=>!i.dueDate)?`<div class="banner warn"><b>AI Flagged</b>${(r.risks||[]).map(x=>`<span>${esc(x)}</span>`).join('')}${r.items.filter(i=>!i.dueDate).length?`<span>${r.items.filter(i=>!i.dueDate).length} item(s) have no date. Set one or untick them.</span>`:''}</div>`:''}
    </aside>
    <section class="card pane" style="min-width:0">
      <div class="sec-h"><div><h2>The AI Found ${r.items.length} Items</h2><div class="small muted">Untick anything you don’t want to track. Owners were matched from roles; change them here.</div></div></div>
      <div class="tw"><div class="igrid" style="min-width:860px">
        <span></span><span class="h">ITEM</span><span class="h">TYPE</span><span class="h">DUE</span><span class="h">AMOUNT</span><span class="h">OWNER(S) / INFORMED</span>
        ${groups.map(([k,label,col])=>{ const idx=r.items.map((i,n)=>i.kind===k?n:-1).filter(n=>n>-1); if(!idx.length) return '';
          return `<div class="ghead" style="grid-column:1/-1;color:${col}">${label.toUpperCase()} · ${idx.length}</div>`+idx.map(n=>{ const i=r.items[n], dep=(i.dependsOn!==undefined&&i.dependsOn!==null&&r.items[i.dependsOn])?r.items[i.dependsOn].title:'';
            return `<input type="checkbox" class="inc" data-k="${n}" ${i.include?'checked':''} aria-label="Include" style="width:auto;margin-top:10px">
            <div class="${i.include?'':'off'}" data-row="${n}"><input class="ttl" data-k="${n}" value="${esc(i.title)}"><div class="xs muted" style="margin-top:4px">${esc(i.description||'')}${dep?`<br><span style="color:var(--warn)">Only after: ${esc(dep)}</span>`:''}${i.recur?`<br>Repeats ${esc(i.recur.toLowerCase())}`:''}${i.note?`<br><i>${esc(i.note)}</i>`:''}</div></div>
            <select class="knd" data-k="${n}">${opt(S.d.kinds,i.kind)}</select>

  r.items.forEach((i,n)=>{ i._own=picker($(`.own[data-k="${n}"]`),i.assignees,'Tag owner',sum); i._wat=picker($(`.wat[data-k="${n}"]`),i.watchers,'Keep informed',sum); });
  sum();
  $('#rX').onclick=()=>{ AI.res=null; AI.file=null; importView(); };
  $('#rGo').onclick=aiCommit;
}
async function aiCommit(){
  const r=AI.res, b=$('#rGo'); $('#rErr').textContent='';

    priority:i.priority||'Normal', dependsOn:i.dependsOn, recur:i.recur||'', assignees:i._own(), watchers:i._wat()}));

  b.disabled=true; b.innerHTML='<span class="spin"></span>Creating and Emailing…';
  try{ const out=await api('aiImport',{projectId:AI.target, docUrl:r.docUrl, items, project:AI.target?null:{name:$('#rN').value, code:$('#rC').value, donor:$('#rD').value, entity:$('#rE').value, start:$('#rS').value, end:$('#rF').value, manager:$('#rM').value, value:pr.value||'', currency:pr.currency||'', summary:pr.summary||''}});

/* ============ live updates, pop-ups, mini window ============ */
function notifSupported(){ return 'Notification' in window; }
function notifBanner(){
  if(!notifSupported() || Notification.permission!=='default') return '';
  return `<div class="notice"><span><b>Turn On Laptop Pop-Ups.</b> Get a pop-up when someone tags you, a date changes or something needs your approval.</span><button class="btn sm" id="bNotif">Turn On Pop-Ups</button></div>`;
}
function bindNotif(){ const b=$('#bNotif'); if(b) b.onclick=async()=>{ await Notification.requestPermission(); render(); }; }
function openMini(){
  const w=window.open(location.pathname+'?mini=1','pulseMini','width=420,height=760');
  if(!w){ S.view='mini'; document.body.classList.add('mini'); render(); }
  S.unseen=0; setBadge(); render();
}
const FL={Delay:['DELAY','var(--bad)'],DateRequest:['DATE REQUEST','var(--warn)'],DateApproved:['DATE APPROVED','var(--ok)'],DateRejected:['DATE DECLINED','var(--bad)'],Change:['CHANGE','var(--warn)'],Completed:['COMPLETED','var(--ok)'],Progress:['PROGRESS','var(--teal-d)'],Comment:['COMMENT','var(--teal-d)'],Created:['NEW ITEM','var(--ahkf)'],Decision:['DECISION','var(--teal-d)'],Risk:['RISK','var(--bad)'],Note:['NOTE','var(--muted)'],Reopen:['REOPENED','var(--warn)']};
function feedTitle(x){
  const who=short(x.by), t=x.taskTitle||x.projectName;
  return {Delay:`${who} Reported a Delay`,DateRequest:`${who} Requested a New Date`,DateApproved:`New Date Approved`,DateRejected:`New Date Declined`,Change:`${who} Reported a Change`,Completed:`Completed: ${t}`,Progress:`Progress on ${t}`,Comment:x.mentioned?`${who} Tagged You`:`${who} Commented`,Created:`New Item: ${t}`,Decision:`Decision Logged`,Risk:`Risk Logged`,Note:x.mentioned?`${who} Tagged You`:`Note from ${who}`,Reopen:`Reopened: ${t}`}[x.type]||t;
}
function miniView(){
  const f=S.mf||'all', items=S.feed.filter(x=>f==='all'||(f==='mentions'&&x.mentioned)||(f==='delays'&&['Delay','DateRequest','Change'].includes(x.type))||(f==='mine'&&x.mine));
  $('#main').innerHTML=`<div class="mini-h"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">Live Updates</b><span class="xs" style="color:var(--ok);display:flex;gap:6px;align-items:center"><span class="dot d-ok"></span>Connected</span></div>
    <div class="filt">${[['all','All'],['mentions','Mentions'],['delays','Delays'],['mine','My Items']].map(([k,l])=>`<button data-f="${k}" class="${f===k?'on':''}">${l}</button>`).join('')}</div>${notifBanner()}</div>
  <div class="mini-list">${items.length?items.map(x=>{ const [k,c]=FL[x.type]||[x.type,'var(--muted)']; return `<div class="mcard" data-open="${esc(x.taskId)}" data-proj="${esc(x.projectId)}" style="${x.important?'border-color:#F0C8CC':''}">
    <div class="k"><span style="color:${c}">${k}</span><span class="muted" style="font-weight:400;letter-spacing:0">${esc(when(x.at))}</span></div><b>${esc(feedTitle(x))}</b>
    <span class="small" style="color:var(--ink2)">${esc((x.text||'').slice(0,160))}${x.newDue?' · '+fmt(x.newDue):''}</span><span class="xs muted">${esc(x.projectName||'General')}</span></div>`; }).join(''):'<div class="empty">No recent activity.</div>'}</div>`;
  $$('.filt button').forEach(b=>b.onclick=()=>{ S.mf=b.dataset.f; miniView(); });
  bindNotif();
  $$('.mcard').forEach(c=>c.onclick=()=>{ if(c.dataset.open) openTask(c.dataset.open); });
}
function setBadge(){ try{ if(navigator.setAppBadge){ S.unseen?navigator.setAppBadge(S.unseen):navigator.clearAppBadge(); } }catch(e){} }
async function popup(x){
  if(!notifSupported()||Notification.permission!=='granted') return;
  const title=feedTitle(x), body=[x.taskTitle&&x.type!=='Completed'?x.taskTitle:'', x.text?String(x.text).slice(0,140):'', x.projectName].filter(Boolean).join('\n');
  const url=location.pathname+(x.taskId?'?task='+encodeURIComponent(x.taskId):'');
  try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg){ reg.showNotification(title,{body,tag:x.id,icon:DET_ICON,badge:DET_ICON,data:{url}}); return; } }catch(e){}
  const n=new Notification(title,{body,tag:x.id,icon:DET_ICON}); n.onclick=()=>{ window.focus(); if(x.taskId) openTask(x.taskId); n.close(); };
}
async function pollFeed(first){
  try{
    const since=ls.get('pp_since')||'';
    const r=await api('feed',{since: first ? '' : since});
    if(first){ S.feed=r.items; }
    else{ const seen=new Set(S.feed.map(x=>x.id)); const fresh=r.items.filter(x=>!seen.has(x.id));
      if(fresh.length){ S.feed=fresh.concat(S.feed).slice(0,80); const imp=fresh.filter(x=>x.important);
        if(!S.mini){ S.unseen+=imp.length; setBadge(); }
        if(S.mini||document.hidden||!document.hasFocus()) imp.slice(0,4).forEach(popup);
        else imp.slice(0,2).forEach(x=>toast(feedTitle(x)));
        const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if(S.view!=='import'&&!$('#scrim')&&!typing){ if(S.mini) miniView(); else reload(); } } }
    ls.set('pp_since', r.now);
  }catch(e){}
}
function startLive(){ clearInterval(S.poll); pollFeed(true).then(()=>{ if(S.mini) miniView(); }); S.poll=setInterval(()=>pollFeed(false), POLL_MS); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!S.mini){ S.unseen=0; setBadge(); } });

/* ============ install & service worker ============ */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; $('#bInstall').hidden=false; });
$('#bInstall').onclick=async()=>{ if(!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall=null; $('#bInstall').hidden=true; };
window.addEventListener('appinstalled',()=>{ $('#bInstall').hidden=true; toast('Installed. Find Project Pulse in your Start menu.'); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', e=>{ if(e.data&&e.data.task&&S.token) openTask(e.data.task); });

/* ============ resume session ============ */
(async()=>{ const t=ls.get('pp_t'); const show=()=>{ $('#login').hidden=false; };
  if(!t){ setTimeout(show, S.mini?0:2600); return; }
  S.token=t; try{ await start(); }catch(e){ S.token=null; ls.set('pp_t',null); show(); } })();
</script>
</body>
